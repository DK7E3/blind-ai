name: Blind AI — CI & Runtime Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full test suite (144 unit, E2E & security audit tests)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run CLI benchmark smoke test
        env:
          PYTHONPATH: src
        run: python -m blind_ai benchmark --format json
